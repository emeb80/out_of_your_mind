<main>
<h1>BOKA RUM</h1>
<!--bokningsformulär skall valideras med Javascript-->
<form class="booking">
    <label for="room">Rum:</label>
    <select name="room" id="room" required>
        <option value="" selected disabled>Välj ett rum</option>
        <option value="inskrivningen">Inskrivningen</option>
        <option value="behandlingen">Behandlingen</option>
        <option value="patienten">Patienten</option>
    </select>
    <label for="date">Välj datum:</label>
    <input type="date" id="date" name="date" required>
    <label for="time">Tid:</label>
    <select name="time" id="time" required>
        <option value="" selected disabled>Tid</option>
        <option value="17:00">17:00</option>
        <option value="18:00">18:00</option>
        <option value="19:00">19:00</option>
        <option value="20:00">20:00</option>
        <option value="21:00">21:00</option>
        </select>
      <label for="persons">Antal:</label>
      <select name="persons" id="persons">
        <option value="" selected disabled>Antal personer</option>
        <option value="2">2</option>
        <option value="2">3</option>
        <option value="2">4</option>
        <option value="2">5</option>
        <option value="2">6</option>
      </select>  
      <label for="name">Namn:</label>
      <input type="text" id="name" name="name">
      <label for="number">Tele:</label>
      <input type="text" id="number" name="number">
      <label for="mail">E-post:</label>
      <input type="email" id="mail" name="mail">
      <label for="message">Meddelande:</label>
      <textarea name="message" id="message" rows="5" placeholder="Skriv ditt meddelande..."></textarea>
      <input type="checkbox" id="terms" name="terms" required>
      <!--lägga till sida för att länka till bokningsvilkoren om det hinns med-->
    <label for="terms">
        Jag godkänner <a href="#booking-terms">bokningsvillkoren</a>
    </label>
      <button class="alert" type="submit">BOKA</button>
</main>
